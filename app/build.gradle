plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kanka.makro'
    compileSdk 34

    defaultConfig {
        applicationId "com.kanka.makro"
        minSdk 26
        targetSdk 34
        // Her GitHub derlemesi otomatik yeni surum numarasi alir (panelde bu sayi kullanilir)
        def derleme = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode derleme
        versionName "1." + derleme
        // Sadece telefon/tablet islemcileri (ARM): emulator kutuphaneleri APK'ya girmesin, boyut kuculur
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Sabit imza: yeni APK eskisinin ustune kurulur, ayarlar silinmez
    // Imza anahtari artik repoda sifreyle durmuyor; GitHub Secrets'ten gelir.
    def ksDosya = file('makro.keystore')
    def ksSifre = System.getenv('KEYSTORE_PASS')
    def ksAd    = System.getenv('KEY_ALIAS')
    def ksAnahtarSifre = System.getenv('KEY_PASS')
    def imzaVar = ksDosya.exists() && ksSifre?.trim() && ksAd?.trim() && ksAnahtarSifre?.trim()
    signingConfigs {
        sabit {
            if (imzaVar) {
                storeFile ksDosya
                storePassword ksSifre
                keyAlias ksAd
                keyPassword ksAnahtarSifre
            }
        }
    }

    buildTypes {
        debug { if (imzaVar) signingConfig signingConfigs.sabit }
        release {
            // Kodu karistir/kucult: APK'yi sokup lisansi atlatmayi zorlastirir
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig imzaVar ? signingConfigs.sabit : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // MykoMobile bot kontrol penceresini okumak icin (cihazda yazi tanima).
    // Google Play Hizmetleri surumu: model APK'ya girmez, telefona bir kez iner -> APK kucuk kalir
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // Reklam: uygulamanın giriş ekranında tek banner (AdMob) + AB/İngiltere için Google rıza penceresi (UMP)
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
}
