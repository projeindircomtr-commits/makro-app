name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: makro-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Commit mesajinda [yayinla] varsa APK GitHub Release olarak yayinlanir.
      # Sitedeki cek.php (cron) yeni surumu birkac dakika icinde kendisi indirir.
      - name: Release olarak yayinla
        if: contains(github.event.head_commit.message, '[yayinla]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          VC=$("$AAPT" dump badging "$APK" | grep -oP "versionCode='\K[0-9]+")
          if [ -z "$VC" ]; then echo "versionCode APK'dan okunamadi"; exit 1; fi
          echo "Surum: $VC"
          cp "$APK" ProjeindirBot.apk
          if gh release view "v$VC" >/dev/null 2>&1; then
            gh release upload "v$VC" ProjeindirBot.apk --clobber
          else
            gh release create "v$VC" ProjeindirBot.apk --target "$GITHUB_SHA" --title "Surum $VC" --notes "Otomatik derleme" --latest
          fi
