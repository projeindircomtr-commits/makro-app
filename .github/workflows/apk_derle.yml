name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: makro-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Commit mesajinda [yayinla] varsa APK siteye yuklenir (sunucu/yukle.php)
      - name: Siteye yukle
        if: contains(github.event.head_commit.message, '[yayinla]')
        env:
          YUKLE_ANAHTAR: ${{ secrets.YUKLE_ANAHTAR }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          # Surum numarasi derlenmis APK'nin icinden okunur
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          VC=$("$AAPT" dump badging "$APK" | grep -oP "versionCode='\K[0-9]+")
          if [ -z "$VC" ]; then echo "versionCode APK'dan okunamadi"; exit 1; fi
          if [ -z "$YUKLE_ANAHTAR" ]; then echo "YUKLE_ANAHTAR secret'i yok"; exit 1; fi
          echo "Yuklenen surum: $VC"
          curl --fail-with-body -sS --max-time 300 -X POST \
            "https://projeindir.com.tr/makro/yukle.php" \
            -F "anahtar=$YUKLE_ANAHTAR" \
            -F "surum=$VC" \
            -F "apk=@$APK;type=application/vnd.android.package-archive"
          echo
